# Server port
server.port=8084

# Optional local secrets file (ignored by Git)
spring.config.import=optional:file:./secrets/application-secrets.properties

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/tbibi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TBIBI_DB_USERNAME:root}
spring.datasource.password=${TBIBI_DB_PASSWORD:}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fix LocalDateTime serialization — sends "2025-01-15T10:30:00" not [2025,1,15,10,30]
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Groq AI configuration (free tier, OpenAI-compatible)
spring.ai.openai.api-key=${TBIBI_GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Disable open-in-view warning
spring.jpa.open-in-view=false

# JWT Authentication
# secret = the key used to sign and verify tokens (keep this private!)
# Must be at least 32 characters for HMAC-SHA256
app.jwt.secret=${TBIBI_JWT_SECRET:TbibiDevOnlyChangeMeBeforeProd123456789}
# expiration = how long a token stays valid in milliseconds
# 86400000 = 24 hours (24 * 60 * 60 * 1000)
app.jwt.expiration=86400000

# Base URL for building file URLs (avatars, uploads)
# Change this if you deploy to a server
app.server.base-url=http://localhost:8084

# Healthsites.io API — nearby medical facilities (hospitals, pharmacies, clinics)
# Docs: https://healthsites.io/api/docs/
app.healthsites.api-key=${TBIBI_HEALTHSITES_API_KEY:}


stripe.secret.key=${TBIBI_STRIPE_SECRET_KEY:}
stripe.success.url=http://localhost:5500/html/main.html
stripe.cancel.url=http://localhost:5500/html/paiement.html

# Frontend base URL — used to build the password reset link in emails
# Change to your public domain before deploying
app.frontend.base-url=http://localhost:5500

# ── Email (SMTP) — for password reset emails ──────────────────────────
# Provider: Gmail  (you can change to any SMTP provider)
#

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${TBIBI_SMTP_USERNAME:}
spring.mail.password=${TBIBI_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
